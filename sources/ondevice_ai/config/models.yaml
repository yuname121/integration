# SafeNest V4 On-Device AI Models Configuration

models:
  thermal:
    model_id: "thermal_fall_int8"
    version: "0.1.0"
    path: "models/thermal/thermal_fall_int8_v0.1.0.tflite"
    framework: "tflite"
    quantization: "int8"
    input:
      shape: [1, 62, 80, 1]
      dtype: "int8"
      scale: 0.003921568859368563
      zero_point: -128
    output:
      shape: [1, 3]
      dtype: "int8"
      scale: 0.00390625
      zero_point: -128
    class_map:
      0: "NOT_HUMAN"
      1: "HUMAN_NORMAL"
      2: "HUMAN_FALL"

  mmwave:
    model_id: "mmwave_resp_int8"
    version: "0.1.0"
    path: "models/mmwave/mmwave_resp_int8_v0.1.0.tflite"
    metadata_path: "models/mmwave/sensor_stats_metadata_v0.1.0.json"
    framework: "tflite"
    quantization: "int8"
    input:
      shape: [1, 300, 1]
      dtype: "int8"
      scale: 0.03259856998920441
      zero_point: -13
    output:
      shape: [1, 3]
      dtype: "int8"
      scale: 0.00390625
      zero_point: -128
    class_map:
      0: "NORMAL"
      1: "RAPID_OR_ABNORMAL"
      2: "APNEA"

  co2:
    model_id: "co2_occupancy_int8"
    version: "0.1.0"
    path: "models/co2/co2_occupancy_int8_v0.1.0.tflite"
    scaler_path: "models/co2/co2_scaling_metadata_v0.1.0.json"
    framework: "tflite"
    quantization: "int8"
    input:
      shape: [1, 3]
      dtype: "int8"
      scale: 0.005828449968248606
      zero_point: 57
    output:
      shape: [1, 2]
      dtype: "int8"
      scale: 0.00390625
      zero_point: -128
    features:
      - "CO2_slope"
      - "Humidity"
      - "CO2"
    class_map:
      0: "VACANT"
      1: "OCCUPIED"
